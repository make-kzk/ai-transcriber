[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-transcriber"
version = "1.2.0"
description = "Мульти-движковая транскрибация встреч, сверка систем и объективный анализ речи"
readme = "README.md"
authors = [
    { name = "Maksim", email = "maksim@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "modal==1.5.5",
    "numpy==2.4.6",
    "httpx==0.28.1",
    "praat-parselmouth==0.4.7",
    "google-genai==2.24.0",
]

[project.scripts]
ai-transcriber = "ai_transcriber.cli:main"
ai-transcriber-gui = "ai_transcriber.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_transcriber*", "speech_analysis*"]
